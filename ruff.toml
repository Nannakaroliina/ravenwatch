# Lint settings for the plugin's Python (scripts/, hooks/). Standard library only, no build step.
line-length = 150
target-version = "py38"

[lint]
# pyflakes, pycodestyle and bugbear: real mistakes, not style churn.
select = ["E", "F", "W", "B"]
ignore = [
  "E741",  # `l` for a line is the house idiom
  "B904",  # errors raised inside `except` are user-facing messages; the chained traceback adds nothing
  "B905",  # zip(strict=) needs Python 3.10
]
