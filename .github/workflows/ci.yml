name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - name: ruff
        run: ruff check --output-format=github scripts hooks
      - name: shellcheck
        # The pre-push hook ships to users, so warnings count there; the tests are held to errors only.
        run: |
          shellcheck --version
          shellcheck -S warning scripts/git-pre-push.sh
          shellcheck -S error tests/*.sh

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest supported; ubuntu-24.04 is the newest image with 3.9 builds.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.15" }
          # Apple's /usr/bin/python3 from the Command Line Tools, what most Mac users run.
          - { os: macos-latest, python: system }
          - { os: macos-latest, python: "3.15" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: put Apple's python3 first
        if: matrix.python == 'system'
        run: echo /usr/bin >> "$GITHUB_PATH"
      - name: python version
        run: command -v python3 && python3 --version
      - name: check it is Apple's python3
        if: matrix.python == 'system'
        run: test "$(command -v python3)" = /usr/bin/python3
      - name: tests
        run: sh tests/run.sh
