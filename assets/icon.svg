<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ravenwatch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232A4D"/>
      <stop offset="1" stop-color="#0F1226"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#F3EEDD"/>
      <stop offset="1" stop-color="#C9C2AE"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- moon / watch lens -->
    <circle cx="254" cy="232" r="176" fill="url(#moon)"/>

    <!-- raven head, faceted, facing left -->
    <g stroke-linejoin="round">
      <!-- main silhouette -->
      <path fill="#0B0D1A" d="
        M 96 252
        L 182 196
        L 226 166
        L 290 146
        L 352 160
        L 392 206
        L 410 300
        L 436 400
        L 460 512
        L 214 512
        L 238 410
        L 250 352
        L 230 336
        L 246 322
        L 222 306
        L 238 292
        L 208 278
        L 196 268
        L 96 252
        Z"/>
      <!-- beak upper facet -->
      <path fill="#262C52" d="M 96 252 L 182 196 L 226 166 L 214 228 Z"/>
      <!-- beak lower facet -->
      <path fill="#171B36" d="M 96 252 L 214 228 L 196 268 Z"/>
      <!-- crown facet -->
      <path fill="#171B35" d="M 226 166 L 290 146 L 352 160 L 300 200 Z"/>
      <!-- cheek facet -->
      <path fill="#12152B" d="M 214 226 L 226 166 L 300 200 L 290 262 Z"/>
      <!-- nape facet -->
      <path fill="#191D38" d="M 352 160 L 392 206 L 410 300 L 330 286 Z"/>
    </g>

    <!-- eye -->
    <circle cx="262" cy="210" r="20" fill="#F5B53D"/>
    <circle cx="266" cy="208" r="8" fill="#0B0D1A"/>
    <circle cx="257" cy="203" r="4" fill="#FFF4D6"/>
  </g>
</svg>
